<style>
/* Layout: one-screen kiosk app. Black terminal standby → white punch-card quiz → white result sheet with a 2-axis map. Single committed look from the team's five brand colors. */
:root {

const ORDER = ['baby', 'cosplay', 'trial', 'npc', 'veteran', 'winner'];

const QS = [
  { a: 'e', q: '你的手機費、房租這些帳單，現在是誰在繳？', o: [
    ['爸媽，我連帳單長怎樣都沒看過', 0, '無知是一種福氣。'],
    ['手機費自己繳，其他家裡處理', 1, '半獨立，很合理。'],
    ['大部分自己繳，偶爾月底求救', 2, '月底的你最誠實。'],
    ['自己的繳完，還幫家裡繳一些', 3, '你是全家的提款機。']] },
  { a: 'e', q: '需要打電話給客服或公家機關，你會？', o: [
    ['請家人幫我打', 0, '家人是最好的代理人。'],
    ['上網爬文一小時，拖到最後一天才打', 1, '電話恐懼症，確診。'],
    ['自己打，但先打好草稿', 2, '專業的緊張。'],
    ['直接打，順便幫朋友一起問', 3, '客服都記得你的聲音了。']] },
  { a: 'e', q: '你手機裡最常跳出來的通知是？', o: [
    ['遊戲和追劇更新', 0, '生活很單純，羨慕。'],
    ['學校或打工群組', 1, '正在加載社會。'],
    ['工作群組', 2, '下班後的上班。'],
    ['工作群組、家族群組、社區群組，全部都要我回', 3, '你的手機比你還累。']] },
  { a: 'e', q: '你家的冰箱裡有什麼？', o: [
    ['冰箱是空的，我媽家有', 0, '你的冰箱在別人家。'],
    ['飲料和零食，這樣不行嗎', 1, '可以，只是有點像便利商店。'],
    ['外送剩菜和一瓶過期的醬料', 2, '那瓶醬料，比你的感情還長久。'],
    ['備好的食材，我有在自己煮', 3, '冰箱都比你有規劃。']] },
  { a: 'e', q: '你知道自己的健保卡在哪裡嗎？', o: [
    ['我以為我媽幫我保管', 0, '你媽是你的雲端硬碟。'],
    ['不知道，但需要的時候再說', 1, '生病的你會很辛苦。'],
    ['大概知道，找得到', 2, '大概，是大人最常用的詞。'],
    ['知道，放在固定的地方', 3, '健保卡比你還有歸屬感。']] },
  { a: 's', q: '月底的你，通常處於什麼狀態？', o: [
    ['我知道錢花在哪裡，但我更在乎它能幫我換到什麼生活', 0, '你在用自己的匯率生活。'],
    ['薪水去哪了？我懷疑我的錢有自己的夢想', 1, '至少錢比你先找到夢想。'],
    ['我有記帳，但偶爾會選擇性失明', 2, '帳本：我看見了，但我不說。'],
    ['固定支出、儲蓄、娛樂費都有安排', 3, '理財書作者想認識你。']] },
  { a: 's', q: '有人問你「五年後的計畫」，你的反應是？', o: [
    ['我笑了，然後沉默', 0, '沉默，也是一種回答。'],
    ['我說「走一步算一步」然後岔開話題', 1, '轉移話題，大人必修技能。'],
    ['我說了一個聽起來合理的答案', 2, '面試官會很滿意。'],
    ['我有規劃，而且有備案', 3, '連備案都有備案。']] },
  { a: 's', q: '突然多出三天完全自由的時間，你會？', o: [
    ['睡到自然醒，想做什麼就做什麼', 0, '這才叫放假。'],
    ['把積欠的雜事處理完，讓生活重新恢復秩序', 1, '放假是用來還債的。'],
    ['安排一個一直想完成的計畫', 2, '連放假都在推進度。'],
    ['沒有行程反而有點不安，還是照平常的節奏生活', 3, '你的生理時鐘有打卡功能。']] },
  { a: 's', q: '看到同年齡的人升職、買房、結婚或創業，你的第一反應是？', o: [
    ['很好啊，但我不一定想過一樣的生活', 0, '你有自己的地圖。'],
    ['恭喜他，我還是先把今天的事情做完', 1, '專心過關，很穩。'],
    ['先研究他怎麼做到的，再看看能不能用在自己身上', 2, '人生攻略，抄一下不犯法。'],
    ['我是不是落後了？人生進度條在哪裡看？', 3, '進度條不存在，但你一直在找。']] },
  { a: 's', q: '你覺得「成功」是？', o: [
    ['今天有好好睡覺就算成功', 0, '那你今天成功了嗎？'],
    ['做自己喜歡的事，同時不餓死', 1, '難度最高的那種成功。'],
    ['我還在定義這個詞', 1, '定義中，請稍候。'],
    ['財務自由、家庭穩定、社會地位', 3, '標準答案，社會給你一百分。']] }
];
const ROAST_MS = 2200, IDLE_MS = 90000;
const $ = id => document.getElementById(id);
const screens = ['standby', 'quiz', 'calc', 'result', 'all'];
let state = { i: 0, e: 0, s: 0 }, idleId = null, typeTimers = [];

function show(id) { screens.forEach(s => $(s).hidden = s !== id); window.scrollTo(0, 0); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function clearTypes() { typeTimers.forEach(clearTimeout); typeTimers = []; }
function typeLines(el, lines, gap, done) {
  clearTypes(); el.innerHTML = '';
  lines.forEach((t, k) => typeTimers.push(setTimeout(() => { const p = document.createElement('p'); p.textContent = t; el.appendChild(p); if (k === lines.length - 1 && done) typeTimers.push(setTimeout(done, gap)); }, gap * k)));
}

function standby() {
  clearTimeout(idleId); show('standby');
  typeLines($('bootLines'), ['考勤系統啟動中…', '讀取玩家編號… NO.' + String(Math.floor(Math.random() * 9000) + 1000), '偵測到「社會期待」模組已預先安裝', '準備進行 10 項社會相容性檢測'], 700);
}

function start() { state = { i: 0, e: 0, s: 0 }; show('quiz'); renderQ(); }

function renderQ() {
  const q = QS[state.i];
  $('holes').innerHTML = QS.map((_, k) => `<i class="${k < state.i ? 'done' : k === state.i ? 'now' : ''}"></i>`).join('');
  $('axisTag').textContent = (q.a === 'e' ? 'EXP 大人經驗值' : 'SCRIPT 劇本服從度') + '　' + String(state.i + 1).padStart(2, '0') + ' / ' + QS.length;
  $('qNum').textContent = 'Q' + String(state.i + 1).padStart(2, '0');
  $('qText').textContent = q.q;
  $('roast').hidden = true;
  $('opts').innerHTML = '';
  shuffle(q.o).forEach(o => {
    const b = document.createElement('button'); b.className = 'opt'; b.textContent = o[0];
    b.addEventListener('click', () => pick(o, b)); $('opts').appendChild(b);
  });
}

function lock() { $('opts').querySelectorAll('button').forEach(b => b.disabled = true); }
function pick(o, btn) { lock(); btn.classList.add('picked'); add(o[1]); roast(o[2]); }
function add(n) { QS[state.i].a === 'e' ? state.e += n : state.s += n; }
function roast(t, label) {
  const r = $('roast'); r.innerHTML = `<span>${label || 'SYSTEM MESSAGE'}</span>`; r.append(t); r.hidden = false;
  setTimeout(() => { state.i++; state.i < QS.length ? renderQ() : calc(); }, ROAST_MS);
}

function calc() {
  show('calc');
  typeLines($('calcLines'), ['計算大人經驗值… ' + state.e + ' / 15', '比對社會標準劇本… ' + state.s + ' / 15', '查詢同關卡玩家…', '角色生成完成。'], 650, result);
}

function counts() { try { return JSON.parse(localStorage.getItem('rsjlz-counts') || '{}'); } catch (e) { return null; } }
function saveCount(k) { const c = counts(); if (!c) return null; c[k] = (c[k] || 0) + 1; try { localStorage.setItem('rsjlz-counts', JSON.stringify(c)); } catch (e) { return null; } return c; }
function stars(n) { return `<b>${'★'.repeat(n)}</b><span>${'★'.repeat(5 - n)}</span>`; }
function typeOf(e, s) { return GRID[e <= 5 ? 0 : e <= 10 ? 1 : 2][s <= 7 ? 0 : 1]; }
function eLabel(e) { return e <= 5 ? '還沒上線' : e <= 10 ? '已經上線' : '老玩家'; }
function sLabel(s) { return s <= 7 ? '我自己的節奏' : '照劇本跑'; }

function mapHTML(key, e, s) {
  const rows = [GRID[2], GRID[1], GRID[0]];
  const cells = rows.map(r => r.map(k => `<div class="cell${k === key ? ' me' : ''}">${TYPES[k].name}</div>`).join('')).join('');
  const pin = e == null ? '' : `<span class="pin" style="left:${(s + .5) / 16 * 100}%;top:${100 - (e + .5) / 16 * 100}%" aria-hidden="true"></span>`;
  return `<div class="mapbox">
    <div class="axis-y mono"><span>↑ 大人經驗值 高</span><span>${e == null ? '' : 'YOU ARE HERE'}</span></div>
    <div class="map" role="img" aria-label="兩軸地圖，你位於${TYPES[key].name}">${cells}${pin}</div>
    <div class="axis-x mono"><span>← 我自己的節奏</span><span>照劇本跑 →</span></div>
  </div>`;
}

function detailHTML(key, e, s) {
  const t = TYPES[key], p = TYPES[t.partner[0]], r = TYPES[t.rival[0]];
  const live = e != null;
  let peers = '';
  if (live) {
    const c = saveCount(key);
    if (c) { const total = Object.values(c).reduce((a, b) => a + b, 0); const pct = Math.round(c[key] / total * 100);
      peers = `<div class="peers"><span class="pct">${pct}%</span><p>在這台機器測過的 ${total} 位玩家中，<br>有 ${c[key]} 位跟你卡在同一關。</p></div>`; }
    else peers = `<div class="peers"><p>你不是一個人卡在這一關。</p></div>`;
  }
  return `
  <div class="res-hero">
    <div class="res-id">
      <div class="row"><span class="code">${t.code}</span><span class="emblem" aria-hidden="true">${ORDER.map(k => `<i class="${k === key ? 'on' : ''}"></i>`).join('')}</span></div>
      <p class="mono" style="color:var(--earth);margin:0">${live ? '你的人生角色是' : '人格檔案'}</p>
      <h2 class="res-name">${t.name}</h2>
      <p class="tagline"><mark>${t.tag}</mark></p>
      ${live ? `<div class="why">你的<b>大人經驗值 ${e} / 15</b>（${eLabel(e)}），<b>劇本服從度 ${s} / 15</b>（${sLabel(s)}）。<br>${t.why}所以你是<b>${t.name}</b>。</div>` : `<div class="why">${t.why}</div>`}
      ${peers}
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      ${mapHTML(key, live ? e : null, live ? s : null)}
      ${live ? `<div class="bars">
        <div class="bar"><span>大人經驗值</span><span class="track"><i style="width:${e / 15 * 100}%"></i></span><span class="num">${e}/15</span></div>
        <div class="bar"><span>劇本服從度</span><span class="track"><i style="width:${s / 15 * 100}%"></i></span><span class="num">${s}/15</span></div>
      </div>` : ''}
    </div>
  </div>
  <div class="sheet">
    <div class="blk wide"><span class="mono">角色簡介 PROFILE</span><p>${t.intro}</p></div>
    <div class="blk"><span class="mono">屬性 STATS</span><div class="stat">${t.stats.map(x => `<span>${x[0]}</span><span class="stars">${stars(x[1])}</span>`).join('')}</div></div>
    <div class="blk"><span class="mono">招式 SKILL</span><span class="skill-name">【${t.skill[0]}】</span><p>${t.skill[1]}</p></div>
    <div class="blk"><span class="mono">弱點 WEAKNESS</span><p>${t.weak}</p></div>
    <div class="blk"><span class="mono">口頭禪 CATCHPHRASE</span><p>${t.line}</p></div>
    <div class="blk"><span class="mono">天生搭檔 PARTNER</span><span class="chip">${p.name}</span><p>${t.partner[1]}</p></div>
    <div class="blk"><span class="mono">天敵 RIVAL</span><span class="chip">${r.name}</span><p>${t.rival[1]}</p></div>
    <div class="blk"><span class="mono">下一關 NEXT STAGE</span><p style="font-weight:700">${t.next}</p></div>
    <div class="blk dark wide" style="grid-column:1 / -1"><span class="mono">過期雞湯 EXPIRED CHICKEN SOUP</span><p class="soup">${t.soup}</p></div>
  </div>`;
}

function result() {
  const key = typeOf(state.e, state.s);
  $('resultWrap').innerHTML = detailHTML(key, state.e, state.s) + `
    <div class="cta"><p>請拿著這個畫面到櫃檯領取你的身分卡 →</p><button class="btn" id="againBtn">下一位玩家</button></div>
    <p class="mono reset-note">90 秒後自動回到待機畫面</p>`;
  $('againBtn').addEventListener('click', standby);
  show('result');
  clearTimeout(idleId); idleId = setTimeout(standby, IDLE_MS);
}

function showType(key) {
  clearTimeout(idleId);
  $('resultWrap').innerHTML = `<div class="toplink"><span class="mono" style="color:var(--earth)">CHARACTER INDEX</span><button class="link" id="backAll">← 回到六種人格</button></div>` + detailHTML(key);
  $('backAll').addEventListener('click', () => show('all'));
  show('result');
}

$('grid6').innerHTML = ORDER.map(k => { const t = TYPES[k]; return `<button class="tcard" data-k="${k}"><span class="code">${t.code}</span><h3>${t.name}</h3><p>${t.tag}</p></button>`; }).join('');
$('grid6').addEventListener('click', ev => { const b = ev.target.closest('.tcard'); if (b) showType(b.dataset.k); });
$('startBtn').addEventListener('click', start);
$('toAll').addEventListener('click', () => { clearTypes(); show('all'); });
$('allBack').addEventListener('click', standby);
standby();
</script>

</body></html>
